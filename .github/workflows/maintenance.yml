# Canonical Maintenance workflow — Nix Packaging Standard.
# Source of truth: github:Daaboulex/nix-packaging-standard. Synced into each
# packaging repo by sync.sh; byte-identity enforced by the `std-conformance`
# flake check. flake.lock refresh: evaluate every declared system, build the
# checks on a runner for each declared system, push only if every one is
# green, else open a labeled issue that closes itself on the next clean run;
# plus stale-branch cleanup. Temporary fixes are probed and healed between the
# update and the verification. Cadence is per-repo via the MAINTENANCE_CADENCE
# repo variable (daily | biweekly | weekly); unset = weekly.
name: Maintenance
on:
  schedule:
    - cron: '0 4 * * *' # Daily 4 AM UTC; the gate job applies the per-repo cadence
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  # Per-repo cadence gate. Set the MAINTENANCE_CADENCE repo variable to
  # `daily` or `biweekly` (Wed+Sun) for fast-moving / closure-heavy repos;
  # unset or any other value means `weekly` (Sun) — identical to the old
  # Sunday-only schedule. workflow_dispatch always runs.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - id: c
        env:
          CADENCE: ${{ vars.MAINTENANCE_CADENCE || 'weekly' }}
          EVENT: ${{ github.event_name }}
        run: |
          dow=$(date -u +%u) # 1=Mon .. 7=Sun
          run=no
          case "$CADENCE" in
          daily) run=yes ;;
          biweekly) if [ "$dow" = 3 ] || [ "$dow" = 7 ]; then run=yes; fi ;;
          *) if [ "$dow" = 7 ]; then run=yes; fi ;; # weekly (default)
          esac
          if [ "$EVENT" = workflow_dispatch ]; then run=yes; fi
          echo "cadence=$CADENCE dow=$dow event=$EVENT -> run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  prepare:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    env:
      LOG: /tmp/log-evaluation.log
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      runners: ${{ steps.candidate.outputs.runners }}
      healed: ${{ steps.heal.outputs.healed }}
      kept: ${{ steps.heal.outputs.kept }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@e847f25223456b3058e12f7fc9d777b6a6f25060 # v3.23.2
        with:
          extra-conf: lazy-trees = false

      - name: Update flake.lock
        run: nix flake update

      - name: Run the flake's after-lock-update app
        run: bash scripts/after-lock-update.sh

      # Probe the temporary fixes against the UPDATED inputs, before the
      # verification build. Probing the committed lock instead would read a fix
      # needed only on the NEW nixpkgs as healed, drop it, and re-break on the
      # next bump. Removals ride the SAME verification as the lock bump, so the
      # two land together or neither does.
      - name: Probe and heal temporary fixes
        id: heal
        run: bash scripts/heal-overlays.sh

      - name: Evaluate every declared system
        run: |
          set -o pipefail
          nix flake check --no-build --all-systems 2>&1 | tee "$LOG"

      - name: Record the candidate
        id: candidate
        run: |
          sha=$(git rev-parse HEAD)
          runners=$(bash scripts/declared-runners.sh)
          git add flake.lock
          git diff --cached --binary > /tmp/candidate.patch
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "runners=$runners" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate
          path: /tmp/candidate.patch
          if-no-files-found: error

      - name: Keep the evaluation log for the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: log-evaluation
          path: ${{ env.LOG }}

  verify:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.prepare.outputs.runners) }}
    runs-on: ${{ matrix.os }}
    env:
      LOG: /tmp/log-${{ matrix.os }}.log
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: DeterminateSystems/determinate-nix-action@e847f25223456b3058e12f7fc9d777b6a6f25060 # v3.23.2
        with:
          extra-conf: lazy-trees = false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate
          path: /tmp/candidate

      - name: Apply the candidate
        run: |
          if [ -s /tmp/candidate/candidate.patch ]; then
            git apply --index /tmp/candidate/candidate.patch
          fi

      - name: Build every check for this system
        run: |
          SYS=$(nix eval --impure --raw --expr 'builtins.currentSystem')
          attempt=$(mktemp)
          build() {
            nix run --inputs-from . nixpkgs#nix-fast-build -- --skip-cached --no-nom --flake ".#checks.$SYS" 2>&1 | tee "$attempt"
            local rc="${PIPESTATUS[0]}"
            cat "$attempt" >>"$LOG"
            return "$rc"
          }
          set +e
          build
          code=$?
          transient='crates\.io|error: cannot download|unable to download|http error 5[0-9][0-9]|status code: (403|429|5[0-9][0-9])|curl: \(|couldn.t resolve host|connection reset by peer|temporary failure in name resolution|operation timed out'
          for backoff in 60 300 900; do
            [ "$code" -eq 0 ] && break
            grep -qiE "$transient" "$attempt" || break
            echo "::warning::Transient external-fetch failure during maintenance build; retrying in ${backoff}s."
            sleep "$backoff"
            build
            code=$?
          done
          exit "$code"

      - name: Keep the build log for the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: log-${{ matrix.os }}
          path: ${{ env.LOG }}

  publish:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate
          path: /tmp/candidate

      - name: Push the verified lock
        env:
          HEALED: ${{ needs.prepare.outputs.healed }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ ! -s /tmp/candidate/candidate.patch ]; then
            echo "Nothing to push: lock unchanged and no fix healed"
            exit 0
          fi
          git apply --index /tmp/candidate/candidate.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$HEALED" ]; then
            git commit -m "chore: update flake.lock; drop healed fix(es): ${HEALED}"
          else
            git commit -m "chore: update flake.lock"
          fi
          git push origin "HEAD:refs/heads/$BRANCH"

      # Nothing else ever closed these, so a maintenance failure that got fixed
      # stayed open forever and kept fleet-audit red (update.yml has always
      # closed its own on success; this is the same contract).
      - name: Close prior failure reports on success
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9 (node24)
        with:
          script: |
            const titleBase = 'Maintenance: flake.lock update broke build';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'maintenance', state: 'open'
            });
            for (const issue of open.data) {
              if (!issue.title.startsWith(titleBase)) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `Resolved: the scheduled lock refresh built clean in [run ${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed', state_reason: 'completed'
              });
            }

  report:
    needs: [prepare, verify]
    if: always() && (needs.prepare.result == 'failure' || needs.verify.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: log-*
          path: /tmp/logs
          merge-multiple: true

      - name: Gather the failure logs
        run: |
          : >/tmp/lock-build.log
          found=0
          for f in /tmp/logs/log-*.log; do
            [ -f "$f" ] || continue
            found=1
            printf '=== %s\n' "$(basename "$f" .log)" >>/tmp/lock-build.log
            cat "$f" >>/tmp/lock-build.log
          done
          if [ "$found" = 0 ]; then
            echo "No log reached the report: the download found no log-*.log file." >>/tmp/lock-build.log
          fi

      - name: Classify failure
        id: classify
        run: bash scripts/classify-build-failure.sh /tmp/lock-build.log

      - name: Report the failure
        env:
          GH_TOKEN: ${{ github.token }}
          FAIL_CLASS: ${{ steps.classify.outputs.class }}
          FAILED_ATTRS: ${{ steps.classify.outputs.failed_attrs }}
          FAILED_DRVS: ${{ steps.classify.outputs.failed_drvs }}
          HEALED: ${{ needs.prepare.outputs.healed }}
          KEPT: ${{ needs.prepare.outputs.kept }}
        run: |
          fence='```'
          {
            printf '## flake.lock update failed to build\n\n'
            printf "The scheduled \`nix flake update\` produced a flake.lock that does not evaluate or build on every declared system. **flake.lock was NOT pushed.**\n\n"
            printf "**Class**: \`%s\`\n" "$FAIL_CLASS"
            printf '**Temporary fixes kept**: %s\n' "${KEPT:-(none)}"
            if [ -n "$HEALED" ]; then
              printf "**Healed fixes NOT pushed**: \`%s\`. They probed as no longer needed against the new inputs, but the verification was red, so the removal was not pushed. If the removal is what broke it, correct that predicate; otherwise the lock bump itself broke the build.\n" "$HEALED"
            fi
            printf '\n### Recovery\n\n%sbash\nnix flake update\nnix flake check --no-build --all-systems\nnix build --no-link\n%s\n' "$fence" "$fence"
          } >/tmp/issue-head.md
          bash scripts/report-failure.sh maintenance "Maintenance: flake.lock update broke build" "Maintenance: flake.lock update broke build ($FAIL_CLASS)" /tmp/issue-head.md /tmp/lock-build.log

  cleanup:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cleanup stale branches
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9 (node24)
        with:
          script: |
            // Delete stale maintenance branches older than 30 days.
            // Matches update/* and upstream-update/* (both _ and / separators).
            const { data: allRefs } = await github.rest.git.listMatchingRefs({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: 'heads/'
            });
            const stalePatterns = [
              /^refs\/heads\/update[\/_]/,
              /^refs\/heads\/upstream-update[\/_]/,
            ];
            const candidates = allRefs.filter(r => stalePatterns.some(p => p.test(r.ref)));
            const thirtyDaysAgo = Date.now() - 30 * 24 * 60 * 60 * 1000;
            for (const ref of candidates) {
              try {
                const { data: commit } = await github.rest.git.getCommit({
                  owner: context.repo.owner, repo: context.repo.repo,
                  commit_sha: ref.object.sha
                });
                if (new Date(commit.author.date).getTime() < thirtyDaysAgo) {
                  console.log(`Deleting stale branch: ${ref.ref}`);
                  await github.rest.git.deleteRef({
                    owner: context.repo.owner, repo: context.repo.repo,
                    ref: ref.ref.replace('refs/', '')
                  });
                }
              } catch (e) {
                console.log(`Skip ${ref.ref}: ${e.message}`);
              }
            }
